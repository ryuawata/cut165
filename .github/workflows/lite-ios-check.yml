name: CUT365 Lite iOS checks
on:
  push:
    branches: [lite]
    paths:
      - 'lite-app/**'
      - '.github/workflows/lite-ios-check.yml'
  pull_request:
    paths:
      - 'lite-app/**'
      - '.github/workflows/lite-ios-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lite-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Validate Expo dependency versions
        run: npx expo install --check
